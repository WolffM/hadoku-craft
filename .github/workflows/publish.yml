name: Publish Package

on:
  push:
    branches:
      - main  # Trigger on every push to main
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    steps:
      - name: Mark the start, so the reported duration is real
        run: echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: WolffM/hadoku-actions/setup-pnpm@v1
        with:
          npm-token: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Install dependencies
        run: pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Build package
        run: pnpm run build

      - name: Check if package changed
        id: package_changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✓ Package has changes"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✗ No changes in package"
          fi

      - name: Check and bump version if needed
        if: steps.package_changed.outputs.changed == 'true'
        run: |
          # Get package name and current version from package.json
          package_name=$(node -p "require('./package.json').name")
          current_version=$(node -p "require('./package.json').version")
          echo "Current version: $current_version"
          
          # Start the walk from the registry's latest, not package.json: CI
          # bumps are published but never committed back, so the committed
          # version only falls behind — and this walk used to replay the whole
          # gap one version at a time on every publish (tenhands died at
          # attempt 99 of exactly that on 2026-08-05). From latest, one step.
          latest_published=$(pnpm view "${package_name}" version 2>/dev/null || echo "")

          # `pnpm view` on a name that has NEVER been published writes its 404 to
          # STDOUT and still exits 0, so the capture above yields an error string
          # rather than "". That string then sorts as the newest "version", gets
          # written into package.json, and publish dies building a tarball named
          # after the error. Broke the first publish of @wolffm/hadoku-craft on
          # 2026-08-25 (the rename from @wolffm/hadoku-printtool). Only accept
          # something that actually looks like a version.
          if ! printf '%s' "$latest_published" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            latest_published=""
          fi

          if [ -n "$latest_published" ]; then
            new_version=$(printf '%s\n%s\n' "$current_version" "$latest_published" | sort -V | tail -1)
            echo "Registry latest: $latest_published; starting walk at $new_version"
          else
            echo "No published version found; starting from package.json"
            new_version="$current_version"
          fi
          max_attempts=10
          attempt=0
          
          while pnpm view "${package_name}@${new_version}" version 2>/dev/null; do
            attempt=$((attempt + 1))
            if [ $attempt -ge $max_attempts ]; then
              echo "❌ Error: Reached maximum version bump attempts ($max_attempts)"
              echo "   Last attempted version: $new_version"
              exit 1
            fi
            
            echo "⚠️  Version $new_version already published, bumping... (attempt $attempt/$max_attempts)"
            
            # Parse version
            major=$(echo $new_version | cut -d. -f1)
            minor=$(echo $new_version | cut -d. -f2)
            patch=$(echo $new_version | cut -d. -f3)
            
            # Rollover at .20 to keep patch numbers manageable (matching pre-commit hook)
            if [ $patch -ge 20 ]; then
              new_minor=$((minor + 1))
              new_version="$major.$new_minor.0"
              echo "🚀 Rolling over to minor version: $new_version"
            else
              new_patch=$((patch + 1))
              new_version="$major.$minor.$new_patch"
              echo "📈 Incrementing patch version: $new_version"
            fi
          done
          
          # Update package.json if version changed
          if [ "$new_version" != "$current_version" ]; then
            node -e "const fs = require('fs'); const p = 'package.json'; const src = fs.readFileSync(p, 'utf8'); const next = src.replace(/(\"version\"\s*:\s*\")[^\"]*(\")/, (m, a, b) => a + process.argv[1] + b); if (next === src) { console.error('could not patch version in ' + p); process.exit(1); } fs.writeFileSync(p, next);" "$new_version"
            
            echo "✅ Version bumped: $current_version → $new_version"
            
            # Update lock file
            pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store install --lockfile-only
          else
            echo "✓ Version $current_version is not published yet"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Publish package
        if: steps.package_changed.outputs.changed == 'true'
        run: pnpm publish --no-git-checks
        env:
          # The repo-local GITHUB_TOKEN (permissions: packages: write above)
          # publishes this repo's OWN package — no PAT. HADOKU_SITE_TOKEN was
          # rotated to minimal scopes on 2026-08-14 (repo, workflow,
          # read:packages); the old one silently carried write:packages and
          # publishing rode on it, which is why this step started 403ing with
          # "The token provided does not match expected scopes". Installs and
          # the version walk still use the PAT: cross-repo @wolffm package
          # READS are outside GITHUB_TOKEN's repo-local grant.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Notify parent app to update dependencies
      - name: Notify parent about package update
        if: steps.package_changed.outputs.changed == 'true'
        env:
          HADOKU_SITE_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}
        run: |
          echo "Notifying hadoku_site about package update..."

          if [ -z "$HADOKU_SITE_TOKEN" ]; then
            echo "⚠️  Warning: HADOKU_SITE_TOKEN not available, skipping notification"
            exit 0
          fi

          payload=$(cat <<EOF
            {
              "event_type": "packages_updated",
              "client_payload": {
                "packages": ["@wolffm/hadoku-craft"],
                "sha": "${{ github.sha }}",
                "ref": "${{ github.ref }}"
              }
            }
          EOF
          )

          status_code=$(curl -sS \
            -o /dev/null \
            -w "%{http_code}" \
            -X POST "https://api.github.com/repos/WolffM/hadoku_site/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $HADOKU_SITE_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload")

          if [ "$status_code" = "204" ]; then
            echo "✅ Notified hadoku_site about package update"
          else
            echo "⚠️  Failed to notify hadoku_site (HTTP $status_code)"
          fi

      # A red run is seen by nobody unless it says so itself: nothing polls
      # these repos. `always()` so RECOVERIES report too -- without the success
      # side the alert state stays broken and the next real failure arrives as a
      # suppressed reminder rather than a new alert.
      - name: Report the outcome so a silent failure can't hide
        if: always()
        uses: WolffM/hadoku-actions/report-job@v1
        with:
          job-name: craft:publish
          service-key: ${{ secrets.KEY_SERVICE_CRAFT }}
          started-at: ${{ env.JOB_STARTED_AT }}
